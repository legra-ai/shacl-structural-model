[package]
name = "shacl-structural-model"
version = "6.0.0"
description = "Typed SHACL structural values for Rust"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/shacl-structural-model"
documentation = "https://docs.rs/shacl-structural-model"
readme = "README.md"
build = "build.rs"
keywords = ["shacl", "rdf", "semantic-web", "validation", "ontology"]
categories = ["data-structures", "encoding"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "build.rs",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[lib]
doctest = true

[dependencies]
iri-rfc3987 = "=0.1.6"
rdf-structural-model = "=0.1.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
oxrdf = { version = "0.3.4", default-features = false }
serde_json = "1"

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
